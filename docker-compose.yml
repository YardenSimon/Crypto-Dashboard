services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cryptide
      POSTGRES_PASSWORD: cryptide
      POSTGRES_DB: cryptide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptide -d cryptide"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cryptide:cryptide@postgres:5432/cryptide
    env_file:
      - .env
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
